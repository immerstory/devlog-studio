name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devlog
          POSTGRES_PASSWORD: devlog
          POSTGRES_DB: devlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlog -d devlog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://devlog:devlog@127.0.0.1:5432/devlog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
